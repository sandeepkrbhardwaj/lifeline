        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #060911;
            overflow: hidden;
            touch-action: manipulation;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .pt-safe { padding-top: max(1rem, var(--safe-top)); }
        .pb-safe { padding-bottom: max(1.2rem, var(--safe-bottom)); }

        #leaflet-map {
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .user-gps-pulse {
            width: 20px;
            height: 20px;
            background: #00d2ff;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 16px #00d2ff;
            position: relative;
        }
        .user-gps-pulse::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 2px solid #00d2ff;
            animation: ring-pulse 1.8s infinite;
        }
        @keyframes ring-pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.8); opacity: 0; }
        }
    </style>

        let state = {

        let leafletMap = null;

        function t() {
            return I18N[state.lang] || I18N.en;
        }

        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function generate50Hospitals(userLat, userLng) {
            return MASTER_52_HOSPITALS.map((h, idx) => {
                const hospLat = userLat + h.offset[0];
                const hospLng = userLng + h.offset[1];
                const dist = calcDistance(userLat, userLng, hospLat, hospLng);
                
                const bloodUnits = {
                    "O+": Math.floor(Math.random() * 24) + 4,
                    "O-": Math.floor(Math.random() * 8) + 1,
                    "A+": Math.floor(Math.random() * 18) + 3,
                    "A-": Math.floor(Math.random() * 6) + 1,
                    "B+": Math.floor(Math.random() * 26) + 5,
                    "B-": Math.floor(Math.random() * 7) + 1,
                    "AB+": Math.floor(Math.random() * 12) + 2,
                    "AB-": Math.floor(Math.random() * 5) + 1
                };

                const oxygenStock = Math.floor(Math.random() * 120) + 35;
                const ventilators = Math.floor(h.icu * 0.6) || 12;

                const searchBlob = `${h.name.toLowerCase()} ${h.spec.toLowerCase()} ${h.address.toLowerCase()} ${h.doctors.map(d => `${d.name.toLowerCase()} ${d.role.toLowerCase()}`).join(' ')}`;

                return {
                    id: `hosp-node-${idx+1}`,
                    name: h.name,
                    address: h.address,
                    lat: hospLat,
                    lng: hospLng,
                    distance: dist,
                    beds: h.beds,
                    icuBeds: h.icu,
                    cost: h.opd,
                    specialty: h.spec,
                    phone: h.phone,
                    doctors: h.doctors,
                    wait: Math.floor(Math.random() * 15) + 4,
                    blood: bloodUnits,
                    medicines: { "Oxygen Cylinders": oxygenStock },
                    ventilators: ventilators,
                    searchBlob: searchBlob
                };
            }).sort((a, b) => a.distance - b.distance);
        }

        window.setState = (updates, rerender = true) => {
            state = { ...state, ...updates };
            window.state = state;
            if (rerender) render();
        };

        window.setLanguage = (lang) => {
            window.setState({ lang });
        };

        window.triggerGPS = () => {
            const locLabel = document.getElementById('user-location-text');
            if (locLabel) locLabel.innerText = "Locating GPS...";

            if (!("geolocation" in navigator)) {
                fallbackLocation();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    state.location = { lat: latitude, lng: longitude, name: "KCC Institute, Greater Noida", granted: true };
                    state.hospitals = generate50Hospitals(latitude, longitude);
                    setState({ loading: false });

                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=15`)
                        .then(r => r.json())
                        .then(d => {
                            const place = d.address?.amenity || d.address?.suburb || d.address?.neighbourhood || d.address?.road || "KCC Institute";
                            const city = d.address?.city || d.address?.city_district || "Greater Noida";
                            state.location.name = `${place}, ${city}`;
                            const label = document.getElementById('user-location-text');
                            if (label) label.innerText = state.location.name;
                        }).catch(() => {});

                    if (state.activeTab === 'map' && leafletMap) {
                        leafletMap.setView([latitude, longitude], 13);
                    }
                },
                () => fallbackLocation(),
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
            );
        };

        function fallbackLocation() {
            const lat = 28.4744, lng = 77.4897;
            state.location = { lat, lng, name: "KCC Institute, Noida-Gre...", granted: false };
            state.hospitals = generate50Hospitals(lat, lng);

            state.searchQuery = query;
            renderHospitalCards();
        };

        function getFilteredHospitals() {
            const raw = state.searchQuery.trim().toLowerCase();
            const words = raw.split(/\s+/).filter(Boolean);
            
            let queryTokens = [...words];
            words.forEach(w => {
                if (SEARCH_SYNONYMS[w]) queryTokens.push(...SEARCH_SYNONYMS[w]);
            });

            return state.hospitals.filter(h => {
                if (queryTokens.length > 0) {
                    return queryTokens.some(tok => h.searchBlob.includes(tok));
                }
                return true;
            });
        }

        function renderHospitalCards() {
            const stack = document.getElementById('hospital-card-stack');
            if (!stack) return;
            const items = getFilteredHospitals();

        window.initLeafletMap = () => {
            const mapContainer = document.getElementById('leaflet-map');

                const m = L.marker([h.lat, h.lng], { icon: hospIcon }).addTo(leafletMap);
                m.on('click', () => {
                    window.setState({ viewingHospitalDetail: h.id });
                });
            });
        };

        // --- VIEWS ---

        // Header with clean Language Selector right beside GPS Lock Target
        function renderHeader() {
            return `
                <header class="bg-slate-900 border-b border-slate-800 px-4 pt-safe pb-3.5 flex items-center justify-between sticky top-0 z-40">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 text-white flex items-center justify-center shadow-lg shadow-cyan-500/20">
                            <i data-lucide="zap" class="w-5 h-5 fill-white text-white"></i>
                        </div>
                        <div>
                            <span class="text-[9px] font-black tracking-widest text-cyan-400 uppercase leading-none block">${t().liveGrid}</span>
                            <p id="user-location-text" class="text-xs font-extrabold text-white tracking-tight truncate max-w-[130px] mt-0.5">
                                ${state.location.name}
                            </p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <!-- 4-Language Switcher beside GPS -->
                        <div class="flex items-center bg-slate-800/90 border border-slate-700/80 p-0.5 rounded-xl">
                            ${[
                                { id: 'en', label: 'EN' },
                                { id: 'hi', label: 'HI' },
                                { id: 'hien', label: 'HING' },
                                { id: 'bn', label: 'BN' }
                            ].map(l => `
                                <button onclick="window.setLanguage('${l.id}')" class="px-1.5 py-1 rounded-lg text-[10px] font-black transition-all ${state.lang === l.id ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}">
                                    ${l.label}
                                </button>
                            `).join('')}
                        </div>

                        <!-- GPS Lock Target -->
                        <button onclick="window.triggerGPS()" class="w-10 h-10 rounded-xl bg-slate-800/90 border border-slate-700 text-cyan-400 hover:text-white flex items-center justify-center active:scale-90 transition-all shadow-md">
                            <i data-lucide="locate-fixed" class="w-4 h-4"></i>
                        </button>
                    </div>
                </header>
            `;
        }

        function renderUserHome() {
            return `
                <div class="flex-1 overflow-y-auto hide-scrollbar p-5 space-y-5 pb-36">
                    
                    <!-- Search Input Bar (No filter chips underneath) -->
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input 
                            type="text" 
                            id="query-input"
                            oninput="window.onSearch(this.value)"
                            placeholder="${t().searchPlaceholder}" 
                            value="${state.searchQuery}"
                            class="w-full bg-slate-800 border border-slate-700/80 text-white placeholder-slate-400 text-xs font-bold pl-12 pr-4 py-4 rounded-2xl focus:outline-none focus:border-blue-500 shadow-inner"
                        />
                    </div>

                    <!-- National 108 Helpline Banner -->
                    <div class="bg-gradient-to-r from-red-600 to-rose-700 p-5 rounded-3xl text-white flex items-center justify-between shadow-xl shadow-red-950/50">
                        <div>
                            <span class="text-[9px] font-black uppercase tracking-widest bg-red-800/60 px-2 py-0.5 rounded-md">${t().helplineTitle}</span>
                            <h3 class="text-2xl font-black mt-1 leading-none tracking-tight">${t().call108}</h3>
                            <p class="text-[10px] font-semibold text-red-100 mt-1">${t().helplineSub}</p>
                        </div>
                        <a href="tel:108" class="w-13 h-13 p-3.5 bg-white text-red-600 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-transform">
                            <i data-lucide="phone-call" class="w-6 h-6 fill-current"></i>
                        </a>
                    </div>

                    <!-- List Header -->
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-2">
                                <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">${t().nearestUnits}</h2>
                                <span class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md font-bold uppercase tracking-wider">${t().ascendingOrder}</span>
                            </div>
                            <span id="center-count-label" class="text-xs font-bold text-blue-400">${state.hospitals.length} ${t().centersFound}</span>
                        </div>
                        <div id="hospital-card-stack" class="space-y-3.5">
                            <!-- Populated with 50+ hospitals in ascending distance order -->
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMapView() {
            return `
                <div class="flex-1 w-full h-full relative overflow-hidden pb-24">
                    <div id="leaflet-map"></div>
                    <div class="absolute bottom-28 left-4 right-4 z-[999] bg-slate-900/90 backdrop-blur-md p-3.5 rounded-2xl border border-slate-700 shadow-2xl flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                            <p class="text-xs font-extrabold text-white">0-30 km Radial Map (${state.hospitals.length} Centers)</p>
                        </div>
                        <button onclick="if(leafletMap) leafletMap.setView([state.location.lat, state.location.lng], 13)" class="text-[10px] font-bold bg-blue-600 text-white px-3 py-1.5 rounded-xl active:scale-95">Recenter</button>
                    </div>
                </div>
            `;
        }

        function renderBloodView() {
            return `
                <div class="flex-1 overflow-y-auto hide-scrollbar p-5 space-y-4 pb-36">
                    <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-3xl">
                        <h2 class="text-lg font-black text-white">${t().bloodBankTitle}</h2>
                        <p class="text-xs text-slate-400 font-semibold mt-1">${t().bloodBankSub}</p>
                    </div>
                    ${state.hospitals.map(h => `
                        <div class="bg-slate-800/60 border border-slate-700/40 p-4 rounded-3xl space-y-3">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h4 class="text-sm font-extrabold text-white">${h.name}</h4>
                                    <p class="text-[10px] font-bold text-blue-400">${h.distance < 1 ? (h.distance * 1000).toFixed(0) + ' m' : h.distance.toFixed(1) + ' km'} away</p>
                                </div>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lng}" target="_blank" class="text-[10px] font-bold bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl">${t().directions}</a>
                            </div>
                            <div class="grid grid-cols-4 gap-2">
                                ${Object.entries(h.blood).map(([type, units]) => `
                                    <div class="p-2 bg-slate-900/70 rounded-xl text-center border border-slate-800">
                                        <span class="text-xs font-black text-white">${type}</span>
                                        <p class="text-[10px] font-extrabold ${units > 2 ? 'text-emerald-400' : 'text-rose-500'} mt-0.5">${units}u</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // --- 4TH TAB: 12 COMMON CRITICAL DISEASES & EMERGENCY CARE IN 4 LANGUAGES ---
        function renderDiseasesView() {
            const list = COMMON_12_DISEASES[state.lang] || COMMON_12_DISEASES.en;
            return `
                <div class="flex-1 overflow-y-auto hide-scrollbar p-5 space-y-4 pb-36">
                    <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-3xl">
                        <span class="text-[10px] font-black uppercase tracking-widest text-emerald-400">12 Critical Conditions</span>
                        <h2 class="text-xl font-black text-white mt-1">${t().diseases} & Clinical First Aid</h2>
                        <p class="text-xs text-slate-400 font-semibold mt-1">Actions to take immediately before hospital admission</p>
                    </div>

                    ${list.map(d => `
                        <div class="bg-slate-800/60 border border-slate-700/40 p-5 rounded-3xl space-y-3">
                            <div class="flex items-start justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-rose-500/20 border border-rose-500/30 text-rose-400 rounded-xl flex items-center justify-center shrink-0">
                                        <i data-lucide="shield-alert" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <span class="text-[9px] font-black uppercase text-slate-400 tracking-wider">${d.category}</span>
                                        <h3 class="font-extrabold text-white text-sm leading-tight">${d.title}</h3>
                                    </div>
                                </div>
                                <span class="text-[9px] font-bold text-cyan-400 bg-cyan-950/60 border border-cyan-800/40 px-2 py-0.5 rounded-md shrink-0">
                                    ${d.docType}
                                </span>
                            </div>

                            <div class="space-y-1.5 pt-1">
                                ${d.steps.map((s, idx) => `
                                    <div class="flex gap-2.5 items-start text-xs text-slate-300">
                                        <span class="w-4 h-4 rounded-full bg-slate-700 text-slate-300 font-black text-[9px] flex items-center justify-center shrink-0 mt-0.5">${idx+1}</span>
                                        <p class="leading-relaxed">${s}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // --- 5-OPTION BOTTOM NAVIGATION (Diseases in 4th position) ---
        function renderNavbar() {
            return `
                <nav class="absolute bottom-0 w-full bg-slate-900/95 backdrop-blur-2xl border-t border-slate-800 flex justify-around items-center p-3 pb-safe z-40">
                    <button onclick="window.setState({activeTab: 'home'})" class="p-2 flex flex-col items-center gap-1 ${state.activeTab === 'home' ? 'text-blue-500 scale-105' : 'text-slate-500'}">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        <span class="text-[9px] font-extrabold">${t().home}</span>
                    </button>

                    <button onclick="window.setState({activeTab: 'map'})" class="p-2 flex flex-col items-center gap-1 ${state.activeTab === 'map' ? 'text-blue-500 scale-105' : 'text-slate-500'}">
                        <i data-lucide="map" class="w-5 h-5"></i>
                        <span class="text-[9px] font-extrabold">${t().map}</span>
                    </button>

                    <!-- Central SOS Action -->
                    <div onclick="window.setState({activeTab: 'home'})" class="w-14 h-14 -mt-8 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-blue-600/40 ring-4 ring-slate-900 active:scale-90 transition-transform cursor-pointer">
                        <i data-lucide="zap" class="w-6 h-6 fill-white"></i>
                    </div>

                    <!-- 4th Option: 12 Common Diseases -->
                    <button onclick="window.setState({activeTab: 'diseases'})" class="p-2 flex flex-col items-center gap-1 ${state.activeTab === 'diseases' ? 'text-blue-500 scale-105' : 'text-slate-500'}">
                        <i data-lucide="activity" class="w-5 h-5"></i>
                        <span class="text-[9px] font-extrabold">${t().diseases}</span>
                    </button>

                    <!-- 5th Option: Blood -->
                    <button onclick="window.setState({activeTab: 'blood'})" class="p-2 flex flex-col items-center gap-1 ${state.activeTab === 'blood' ? 'text-blue-500 scale-105' : 'text-slate-500'}">
                        <i data-lucide="droplet" class="w-5 h-5"></i>
                        <span class="text-[9px] font-extrabold">${t().blood}</span>
                    </button>
                </nav>
            `;
        }

        function renderDetailModal() {
            if (!state.viewingHospitalDetail) return '';
            const h = state.hospitals.find(x => x.id === state.viewingHospitalDetail);
            if (!h) return '';

            return `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="window.setState({viewingHospitalDetail: null})">
                    <div class="bg-slate-900 border border-slate-700/80 w-full sm:max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] max-h-[90vh] flex flex-col overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
                        <div class="p-5 border-b border-slate-800 bg-slate-800/50 flex justify-between items-start">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <span class="text-[9px] font-black uppercase text-emerald-400 tracking-wider">Live Verified Hospital</span>
                                    <span class="text-[9px] font-extrabold text-blue-400 bg-blue-950/90 border border-blue-800/50 px-2 py-0.5 rounded-full">
                                        ${h.distance < 1 ? (h.distance * 1000).toFixed(0) + ' m' : h.distance.toFixed(1) + ' km'} away
                                    </span>
                                </div>
                                <h2 class="text-xl font-black text-white leading-tight">${h.name}</h2>
                                <p class="text-xs text-slate-400">${h.address}</p>
                            </div>
                            <button onclick="window.setState({viewingHospitalDetail: null})" class="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>

                        <div class="p-5 overflow-y-auto hide-scrollbar space-y-4">
                            <!-- Beds & ICU -->
                            <div class="grid grid-cols-3 gap-2.5">
                                <div class="bg-slate-800/90 p-3 rounded-2xl text-center border border-slate-700/50">
                                    <span class="text-xl font-black text-blue-400">${h.beds}</span>
                                    <p class="text-[9px] font-bold text-slate-400 uppercase mt-0.5">${t().beds}</p>
                                </div>
                                <div class="bg-rose-950/40 p-3 rounded-2xl text-center border border-rose-900/50">
                                    <span class="text-xl font-black text-rose-400">${h.icuBeds}</span>
                                    <p class="text-[9px] font-bold text-rose-400 uppercase mt-0.5">${t().icu}</p>
                                </div>
                                <div class="bg-emerald-950/40 p-3 rounded-2xl text-center border border-emerald-900/50">
                                    <span class="text-xl font-black text-emerald-400">₹${h.cost}</span>
                                    <p class="text-[9px] font-bold text-emerald-400 uppercase mt-0.5">${t().opdFee}</p>
                                </div>
                            </div>

                            <!-- Available Doctors and Fees -->
                            <div class="bg-slate-800/60 border border-slate-700/40 p-4 rounded-2xl space-y-2.5">
                                <h4 class="text-[10px] font-extrabold uppercase text-slate-400 tracking-wider">Available Specialists & Pricing</h4>
                                <div class="space-y-2 pt-1">
                                    ${h.doctors.map(d => `
                                        <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                            <div>
                                                <p class="text-xs font-black text-white">${d.name}</p>
                                                <p class="text-[10px] text-slate-400">${d.role}</p>
                                            </div>
                                            <span class="text-xs font-black text-emerald-400">₹${d.fee}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Oxygen & Ventilators -->
                            <div class="bg-slate-800/60 border border-slate-700/40 p-4 rounded-2xl space-y-2">
                                <h4 class="text-[10px] font-extrabold uppercase text-slate-400 tracking-wider">Life Support Inventory</h4>
                                <div class="grid grid-cols-2 gap-2 pt-1 text-center">
                                    <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                        <span class="text-sm font-black text-cyan-400">${h.medicines["Oxygen Cylinders"]}</span>
                                        <p class="text-[8px] font-bold text-slate-400 uppercase mt-0.5">O2 Cylinders</p>
                                    </div>
                                    <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                        <span class="text-sm font-black text-teal-400">${h.ventilators}</span>
                                        <p class="text-[8px] font-bold text-slate-400 uppercase mt-0.5">Ventilators</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Complete 8-Group Blood Bank Stock -->
                            <div class="bg-slate-800/60 border border-slate-700/40 p-4 rounded-2xl space-y-2">
                                <h4 class="text-[10px] font-extrabold uppercase text-slate-400 tracking-wider">Available Blood Units (All 8 Groups)</h4>
                                <div class="grid grid-cols-4 gap-2">
                                    ${Object.entries(h.blood).map(([type, units]) => `
                                        <div class="bg-slate-900/90 p-2 rounded-xl text-center border border-slate-800">
                                            <span class="text-xs font-black text-white">${type}</span>
                                            <p class="text-[10px] font-extrabold ${units > 2 ? 'text-emerald-400' : 'text-rose-500'} mt-0.5">${units}u</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="pt-2 pb-safe space-y-2">
                                <div class="flex gap-2">
                                    <a href="tel:108" class="flex-1 py-3.5 rounded-2xl bg-rose-600 text-white font-extrabold text-xs uppercase tracking-wider text-center flex items-center justify-center gap-1.5 shadow-lg shadow-rose-950/50">
                                        <i data-lucide="phone-call" class="w-4 h-4"></i> ${t().callBtn}
                                    </a>
                                    <a href="tel:${h.phone}" class="flex-1 py-3.5 rounded-2xl bg-slate-800 border border-slate-700 text-white font-extrabold text-xs uppercase tracking-wider text-center flex items-center justify-center gap-1.5">
                                        <i data-lucide="phone" class="w-4 h-4 text-emerald-400"></i> Hospital ER
                                    </a>
                                </div>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lng}" target="_blank" class="w-full py-4 rounded-2xl bg-blue-600 text-white font-black text-xs uppercase tracking-widest text-center flex items-center justify-center gap-2 shadow-xl shadow-blue-950/60">
                                    <i data-lucide="navigation" class="w-4 h-4"></i> ${t().routeBtn}
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- RENDER ENGINE ---
        function render() {
            const container = document.getElementById('app-container');
            if (!container) return;

            if (state.loading) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center bg-slate-950 p-6 text-center">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white shadow-xl shadow-cyan-500/30 animate-pulse mb-3">
                            <i data-lucide="zap" class="w-7 h-7 fill-white"></i>
                        </div>
                        <h1 class="text-xs font-black text-white tracking-widest uppercase">Connecting Emergency Grid (50+ Centers)...</h1>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let tabContent = '';
            if (state.activeTab === 'home') tabContent = renderUserHome();
            else if (state.activeTab === 'map') tabContent = renderMapView();
            else if (state.activeTab === 'diseases') tabContent = renderDiseasesView();
            else if (state.activeTab === 'blood') tabContent = renderBloodView();

            container.innerHTML = `
                ${renderHeader()}
                ${tabContent}
                ${renderNavbar()}
                ${renderDetailModal()}
            `;

            if (state.activeTab === 'home') {
                renderHospitalCards();
            } else if (state.activeTab === 'map') {
                setTimeout(() => initLeafletMap(), 60);
            }

            lucide.createIcons();
        }

        render();
        window.triggerGPS();
    </script>
</body>
</html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            /* Clearance for host badges like Netlify / Vercel */
            --host-badge-height: 3.4rem;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            touch-action: pan-y;
            background-color: #e2e8f0;
        }

        #app-root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #f8fafc;
        }

        /* Ample padding to ensure bottom cards scroll completely clear of the floating nav */
        .scroll-body {
            flex: 1 1 0%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(9.5rem + var(--sab));
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .header-bar {
            padding-top: max(0.75rem, var(--sat));
            padding-bottom: 0.75rem;
            flex-shrink: 0;
            z-index: 40;
        }

        /* Shifted upwards so the bottom bar floats cleanly above host badges */
        .floating-bottom-nav {
            position: absolute;
            left: 0.75rem;
            right: 0.75rem;
            bottom: calc(var(--host-badge-height) + var(--sab) + 0.35rem);
            border-radius: 1.5rem;
            box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.15), 0 4px 12px rgba(0, 0, 0, 0.08);
            z-index: 50;
        }

        #leaflet-map {
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .user-gps-pulse {
            width: 22px;
            height: 22px;
            background: #2563eb;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.6);
            position: relative;
        }
        .user-gps-pulse::after {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border-radius: 50%;
            border: 2px solid #3b82f6;
            animation: ring-pulse 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }
        @keyframes ring-pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.6); opacity: 0; }
        }

        /* Splash Transitions */
        #splash-screen {
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-out {
            opacity: 0 !important;
            transform: scale(0.95) translateY(-8px) !important;
            pointer-events: none;
        }

        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-heart {
            animation: pulseHeart 1.4s infinite ease-in-out;
        }
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>

        // --- EXTENDED SYMPTOMS & CLINICAL SYNONYMS DICTIONARY ---

        // --- APP STATE ---
        let state = {
            loading: true,
            activeTab: 'home',
            lang: 'en',
            langDropdownOpen: false,
            location: { lat: 28.4744, lng: 77.4897, name: "Knowledge Park III, Greater Noida", granted: false },
            hospitals: [],

        window.state = state;

        let leafletMap = null;
        let gpsWatchId = null;

        function t() {
            return I18N[state.lang] || I18N.en;
        }

        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function populateHospitals(userLat, userLng) {
            const list = MASTER_REAL_HOSPITALS.map((h, idx) => {
                const dist = calcDistance(userLat, userLng, h.lat, h.lng);
                const bloodUnits = {
                    "O+": Math.floor(Math.random() * 24) + 4,
                    "O-": Math.floor(Math.random() * 8) + 1,
                    "A+": Math.floor(Math.random() * 18) + 3,
                    "A-": Math.floor(Math.random() * 6) + 1,
                    "B+": Math.floor(Math.random() * 26) + 5,
                    "B-": Math.floor(Math.random() * 7) + 1,
                    "AB+": Math.floor(Math.random() * 12) + 2,
                    "AB-": Math.floor(Math.random() * 5) + 1
                };

                const oxygenStock = Math.floor(Math.random() * 120) + 35;
                const ventilators = Math.floor(h.icu * 0.6) || 12;
                const searchBlob = `${h.name.toLowerCase()} ${h.spec.toLowerCase()} ${h.address.toLowerCase()} ${h.doctors.map(d => `${d.name.toLowerCase()} ${d.role.toLowerCase()}`).join(' ')}`;

                return {
                    id: `real-hosp-${idx+1}`,
                    name: h.name,
                    address: h.address,
                    lat: h.lat,
                    lng: h.lng,
                    distance: dist,
                    beds: h.beds,
                    icuBeds: h.icu,
                    cost: h.opd,
                    specialty: h.spec,
                    phone: h.phone,
                    doctors: h.doctors,
                    wait: Math.floor(Math.random() * 15) + 4,
                    blood: bloodUnits,
                    medicines: { "Oxygen Cylinders": oxygenStock },
                    ventilators: ventilators,
                    searchBlob: searchBlob
                };
            })
            .sort((a, b) => a.distance - b.distance);

            state.hospitals = list;
        }

        window.setState = (updates, rerender = true) => {
            state = { ...state, ...updates };

        // Transition Exit: Dismisses splash and unlocks console
        function dismissSplash() {
            if (splashDismissed) return;
            splashDismissed = true;
            if (permissionTimer) clearTimeout(permissionTimer);

            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => {
                    state.loading = false;
                    render();
                }, 450);
            } else {
                state.loading = false;
                render();
            }
        }

        // Location Requester with 5-Second Watchdog
        window.requestGPSWithPermissionGate = () => {
            populateHospitals(state.location.lat, state.location.lng);

            // 5-second timeout watchdog
            permissionTimer = setTimeout(() => {
                if (state.loading) {
                    state.permissionTimedOut = true;
                    render();
                }
            }, 5000);

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        state.location = { lat: latitude, lng: longitude, name: "Knowledge Park, Greater Noida", granted: true };
                        populateHospitals(latitude, longitude);

                        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=15`)
                            .then(r => r.json())
                            .then(d => {
                                const place = d.address?.amenity || d.address?.suburb || d.address?.road || "Knowledge Park III";
                                const city = d.address?.city || d.address?.city_district || "Greater Noida";
                                state.location.name = `${place}, ${city}`;
                                const label = document.getElementById('user-location-text');
                                if (label) label.innerText = state.location.name;
                            }).catch(() => {});

                        dismissSplash();
                    },
                    (err) => {
                        console.warn("Permission Denied or Error:", err.message);
                        state.permissionTimedOut = true;
                        render();
                    },
                    { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
                );
            } else {
                state.permissionTimedOut = true;
                render();
            }
        };

        window.proceedWithDefaultLocation = () => {
            state.location = { lat: 28.4744, lng: 77.4897, name: "Knowledge Park III, Greater Noida", granted: false };
            populateHospitals(28.4744, 77.4897);
            dismissSplash();
        };

        window.triggerGPS = () => {
            const locLabel = document.getElementById('user-location-text');
            if (locLabel) locLabel.innerText = "Re-locking GPS...";

            if ("geolocation" in navigator) {
                if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);

                gpsWatchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        state.location = { lat: latitude, lng: longitude, name: "Knowledge Park, Greater Noida", granted: true };
                        populateHospitals(latitude, longitude);
                        render();

                        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=15`)
                            .then(r => r.json())
                            .then(d => {
                                const place = d.address?.amenity || d.address?.suburb || d.address?.road || "Knowledge Park III";
                                const city = d.address?.city || d.address?.city_district || "Greater Noida";
                                state.location.name = `${place}, ${city}`;
                                const label = document.getElementById('user-location-text');
                                if (label) label.innerText = state.location.name;
                            }).catch(() => {});

                        if (state.activeTab === 'map' && leafletMap) {
                            leafletMap.setView([latitude, longitude], 13);
                        }
                    },
                    (err) => console.warn(err),
                    { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
                );
            }
        };

        window.onSearch = (query) => {
            state.searchQuery = query;
            renderHospitalCards();
        };

        function getFilteredHospitals() {
            const raw = state.searchQuery.trim().toLowerCase();
            const words = raw.split(/\s+/).filter(Boolean);
            
            let queryTokens = [...words];
            words.forEach(w => {
                if (SEARCH_SYNONYMS[w]) queryTokens.push(...SEARCH_SYNONYMS[w]);
            });

            return state.hospitals.filter(h => {
                if (queryTokens.length > 0) {
                    return queryTokens.some(tok => h.searchBlob.includes(tok));
                }
                return true;
            });
        }

                                        <button onclick="window.selectLanguage('${k}')" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center justify-between ${state.lang === k ? 'bg-blue-600 text-white' : 'hover:bg-slate-100'}">
                                            <span>${v.langName}</span>
                                            ${state.lang === k ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                                        </button>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>

                        <!-- GPS Button -->
                        <button onclick="window.triggerGPS()" class="w-8 h-8 rounded-lg bg-slate-50 text-blue-600 border border-slate-300 flex items-center justify-center active:scale-90 transition-transform shadow-xs">
                            <i data-lucide="locate-fixed" class="w-4 h-4"></i>
                        </button>
                    </div>
                </header>
            `;
        }

        function renderUserHome() {
            return `
                <div class="scroll-body hide-scrollbar p-4 space-y-4 fade-in">
                    <!-- Clean Search Input -->
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input 
                            type="text" 
                            id="query-input"
                            oninput="window.onSearch(this.value)"
                            placeholder="${t().searchPlaceholder}" 
                            value="${state.searchQuery}"
                            class="w-full bg-white border border-slate-200 text-slate-900 placeholder-slate-400 text-xs font-semibold pl-10 pr-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 shadow-xs"
                        />
                    </div>

                    <!-- 108 Helpline Banner -->
                    <div class="bg-gradient-to-r from-red-600 to-rose-600 p-4 rounded-2xl text-white flex items-center justify-between shadow-lg shadow-red-500/20">
                        <div>
                            <span class="text-[9px] font-black uppercase tracking-widest bg-red-800/50 px-1.5 py-0.5 rounded">${t().helplineTitle}</span>
                            <h3 class="text-xl font-black mt-1 leading-none">${t().call108}</h3>
                            <p class="text-[10px] font-medium text-red-100 mt-0.5">${t().helplineSub}</p>
                        </div>
                        <a href="tel:108" class="w-11 h-11 bg-white text-red-600 rounded-xl flex items-center justify-center shadow-md active:scale-95 transition-transform">
                            <i data-lucide="phone-call" class="w-5 h-5 fill-current"></i>
                        </a>
                    </div>

                    <!-- Hospitals List Stack -->
                    <div>
                        <div class="flex justify-between items-center mb-2.5 px-0.5">
                            <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500">${t().nearestUnits}</h2>
                            <span id="center-count-label" class="text-xs font-bold text-blue-600">${state.hospitals.length} ${t().centersFound}</span>
                        </div>
                        <div id="hospital-card-stack" class="space-y-3">
                            <!-- Injected Cards -->
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMapView() {
            return `
                <div class="flex-1 w-full h-full relative overflow-hidden fade-in">
                    <div id="leaflet-map"></div>
                    <div class="absolute bottom-28 left-3 right-3 z-[45] bg-white/95 border border-slate-200 text-slate-900 p-3 rounded-xl shadow-xl flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                            <p class="text-xs font-extrabold">Real Medical Map (${state.hospitals.length})</p>
                        </div>
                        <button onclick="if(leafletMap) leafletMap.setView([state.location.lat, state.location.lng], 13)" class="text-[10px] font-bold bg-blue-600 text-white px-2.5 py-1 rounded-lg">Recenter</button>
                    </div>
                </div>
            `;
        }

        function renderBloodView() {
            return `
                <div class="scroll-body hide-scrollbar p-4 space-y-3 fade-in">
                    <div class="bg-white border border-slate-200 text-slate-800 p-4 rounded-2xl shadow-xs">
                        <h2 class="text-base font-black">${t().bloodBankTitle}</h2>
                        <p class="text-xs text-slate-500 font-medium mt-0.5">${t().bloodBankSub}</p>
                    </div>
                    ${state.hospitals.map(h => `
                        <div class="bg-white border border-slate-200 shadow-xs p-3.5 rounded-2xl space-y-2.5">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h4 class="text-sm font-extrabold text-slate-900">${h.name}</h4>
                                    <p class="text-[10px] font-bold text-blue-600">${h.distance < 1 ? (h.distance * 1000).toFixed(0) + ' m' : h.distance.toFixed(1) + ' km'} away</p>
                                </div>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lng}" target="_blank" class="text-[10px] font-bold bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg hover:bg-slate-200">${t().directions}</a>
                            </div>
                            <div class="grid grid-cols-4 gap-1.5">
                                ${Object.entries(h.blood).map(([type, units]) => `
                                    <div class="p-1.5 bg-slate-50 border border-slate-200 rounded-lg text-center">
                                        <span class="text-xs font-black text-slate-800">${type}</span>
                                        <p class="text-[10px] font-extrabold ${units > 2 ? 'text-emerald-600' : 'text-rose-500'} mt-0.5">${units}u</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderDiseasesView() {
            const list = COMMON_12_DISEASES[state.lang] || COMMON_12_DISEASES.en;

            return `
                <div class="scroll-body hide-scrollbar p-4 space-y-3 fade-in">
                    <div class="bg-white border border-slate-200 text-slate-800 p-4 rounded-2xl shadow-xs">
                        <span class="text-[9px] font-black uppercase tracking-widest text-emerald-600">12 Conditions</span>
                        <h2 class="text-lg font-black mt-0.5">${t().diseases}</h2>
                        <p class="text-xs text-slate-500 font-medium mt-0.5">Emergency clinical stabilization protocols</p>
                    </div>

                    ${list.map(d => `
                        <div class="bg-white border border-slate-200 shadow-xs p-3.5 rounded-2xl space-y-2.5">
                            <div class="flex items-start justify-between">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-8 h-8 bg-rose-50 border border-rose-100 text-rose-500 rounded-lg flex items-center justify-center shrink-0">
                                        <i data-lucide="shield-alert" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <span class="text-[9px] font-black uppercase text-slate-400 tracking-wider">${d.category}</span>
                                        <h3 class="font-extrabold text-slate-900 text-xs">${d.title}</h3>
                                    </div>
                                </div>
                                <span class="text-[9px] font-bold text-blue-600 bg-blue-50 border border-blue-200 px-1.5 py-0.5 rounded shrink-0">
                                    ${d.docType}
                                </span>
                            </div>

                            <div class="space-y-1 pt-0.5">
                                ${d.steps.map((s, idx) => `
                                    <div class="flex gap-2 items-start text-xs text-slate-600">
                                        <span class="w-4 h-4 rounded-full bg-slate-100 text-slate-700 font-black text-[9px] flex items-center justify-center shrink-0 mt-0.5">${idx+1}</span>
                                        <p class="leading-relaxed">${s}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // --- SHIFTED UPWARDS FLOATING NAV (Escapes Host Website Badges) ---
        function renderNavbar() {
            return `
                <nav class="floating-bottom-nav bg-white/95 backdrop-blur-2xl border border-slate-200/90 flex justify-around items-center py-2 px-2">
                    <button onclick="window.setState({activeTab: 'home'})" class="p-1 flex flex-col items-center gap-0.5 ${state.activeTab === 'home' ? 'text-blue-600' : 'text-slate-400'}">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        <span class="text-[9px] font-bold">${t().home}</span>
                    </button>

                    <button onclick="window.setState({activeTab: 'map'})" class="p-1 flex flex-col items-center gap-0.5 ${state.activeTab === 'map' ? 'text-blue-600' : 'text-slate-400'}">
                        <i data-lucide="map" class="w-5 h-5"></i>
                        <span class="text-[9px] font-bold">${t().map}</span>
                    </button>

                    <!-- Central SOS Action -->
                    <div onclick="window.setState({activeTab: 'home'})" class="w-12 h-12 -mt-7 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-600/35 ring-4 ring-white active:scale-90 transition-transform cursor-pointer">
                        <i data-lucide="zap" class="w-6 h-6 fill-white"></i>
                    </div>

                    <button onclick="window.setState({activeTab: 'diseases'})" class="p-1 flex flex-col items-center gap-0.5 ${state.activeTab === 'diseases' ? 'text-blue-600' : 'text-slate-400'}">
                        <i data-lucide="activity" class="w-5 h-5"></i>
                        <span class="text-[9px] font-bold">${t().diseases}</span>
                    </button>

                    <button onclick="window.setState({activeTab: 'blood'})" class="p-1 flex flex-col items-center gap-0.5 ${state.activeTab === 'blood' ? 'text-blue-600' : 'text-slate-400'}">
                        <i data-lucide="droplet" class="w-5 h-5"></i>
                        <span class="text-[9px] font-bold">${t().blood}</span>
                    </button>
                </nav>
            `;
        }

        function renderDetailModal() {
            if (!state.viewingHospitalDetail) return '';
            const h = state.hospitals.find(x => x.id === state.viewingHospitalDetail);
            if (!h) return '';

            return `
                <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 fade-in" onclick="window.setState({viewingHospitalDetail: null})">
                    <div class="bg-white border border-slate-200 text-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
                        <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-start">
                            <div>
                                <span class="text-[9px] font-black uppercase text-emerald-600 tracking-wider">Live Verified Hospital</span>
                                <h2 class="text-base font-black leading-tight mt-0.5 text-slate-900">${h.name}</h2>
                                <p class="text-xs text-slate-500 mt-0.5">${h.address}</p>
                            </div>
                            <button onclick="window.setState({viewingHospitalDetail: null})" class="p-1.5 rounded-lg bg-slate-100 text-slate-500 hover:text-slate-800">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <div class="p-4 overflow-y-auto hide-scrollbar space-y-3">
                            <div class="grid grid-cols-3 gap-2">
                                <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-center">
                                    <span class="text-lg font-black text-blue-600">${h.beds}</span>
                                    <p class="text-[8px] font-bold text-slate-400 uppercase mt-0.5">${t().beds}</p>
                                </div>
                                <div class="bg-rose-50 border border-rose-100 text-rose-600 p-2.5 rounded-xl text-center">
                                    <span class="text-lg font-black">${h.icuBeds}</span>
                                    <p class="text-[8px] font-bold uppercase mt-0.5">${t().icu}</p>
                                </div>
                                <div class="bg-emerald-50 border border-emerald-100 text-emerald-600 p-2.5 rounded-xl text-center">
                                    <span class="text-lg font-black">₹${h.cost}</span>
                                    <p class="text-[8px] font-bold uppercase mt-0.5">${t().opdFee}</p>
                                </div>
                            </div>

                            <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-2">
                                <h4 class="text-[9px] font-extrabold uppercase text-slate-400 tracking-wider">Available Doctors</h4>
                                <div class="space-y-1.5">
                                    ${h.doctors.map(d => `
                                        <div class="flex justify-between items-center text-xs">
                                            <div>
                                                <p class="font-extrabold text-slate-800">${d.name}</p>
                                                <p class="text-[10px] text-slate-500">${d.role}</p>
                                            </div>
                                            <span class="font-black text-emerald-600 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded">₹${d.fee}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-2">
                                <h4 class="text-[9px] font-extrabold uppercase text-slate-400 tracking-wider">Life Support Inventory</h4>
                                <div class="grid grid-cols-2 gap-2 text-center">
                                    <div class="bg-white border border-slate-200 p-2 rounded-lg">
                                        <span class="text-sm font-black text-blue-600">${h.medicines["Oxygen Cylinders"]}</span>
                                        <p class="text-[8px] font-bold text-slate-400 uppercase mt-0.5">O2 Cylinders</p>
                                    </div>
                                    <div class="bg-white border border-slate-200 p-2 rounded-lg">
                                        <span class="text-sm font-black text-teal-600">${h.ventilators}</span>
                                        <p class="text-[8px] font-bold text-slate-400 uppercase mt-0.5">Ventilators</p>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-1.5">
                                <h4 class="text-[9px] font-extrabold uppercase text-slate-400 tracking-wider">Available Blood Units</h4>
                                <div class="grid grid-cols-4 gap-1.5">
                                    ${Object.entries(h.blood).map(([type, units]) => `
                                        <div class="bg-white border border-slate-200 p-1.5 rounded-lg text-center">
                                            <span class="text-xs font-black text-slate-800">${type}</span>
                                            <p class="text-[10px] font-extrabold ${units > 2 ? 'text-emerald-600' : 'text-rose-500'} mt-0.5">${units}u</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="pt-2 pb-safe space-y-2">
                                <div class="flex gap-2">
                                    <a href="tel:108" class="flex-1 py-3 rounded-xl bg-rose-600 text-white font-extrabold text-xs uppercase tracking-wider text-center flex items-center justify-center gap-1.5 shadow-md shadow-rose-600/20 active:scale-95">
                                        <i data-lucide="phone-call" class="w-4 h-4"></i> ${t().callBtn}
                                    </a>
                                    <a href="tel:${h.phone}" class="flex-1 py-3 rounded-xl bg-slate-100 border border-slate-300 text-slate-800 font-extrabold text-xs uppercase tracking-wider text-center flex items-center justify-center gap-1.5 active:scale-95">
                                        <i data-lucide="phone" class="w-4 h-4 text-emerald-600"></i> Hospital ER
                                    </a>
                                </div>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lng}" target="_blank" class="w-full py-3.5 rounded-xl bg-blue-600 text-white font-black text-xs uppercase tracking-wider text-center flex items-center justify-center gap-1.5 shadow-md shadow-blue-600/30 active:scale-95">
                                    <i data-lucide="navigation" class="w-4 h-4"></i> ${t().routeBtn}
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- RENDER ENGINE ---
        function render() {
            const root = document.getElementById('app-root');
            if (!root) return;

            if (state.loading) {
                root.innerHTML = `
                    <div id="splash-screen" class="h-full flex flex-col items-center justify-center bg-gradient-to-b from-white via-slate-50 to-blue-50/40 p-6 text-center">
                        <div class="relative mb-6">
                            <div class="w-20 h-20 rounded-3xl bg-blue-600 flex items-center justify-center text-white shadow-2xl shadow-blue-500/40 pulse-heart">
                                <i data-lucide="heart-pulse" class="w-10 h-10 stroke-[2.2]"></i>
                            </div>
                            <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full border-2 border-white flex items-center justify-center">
                                <span class="w-2 h-2 bg-white rounded-full animate-ping"></span>
                            </span>
                        </div>
                        
                        <h1 class="text-3xl font-black text-slate-900 tracking-tight leading-none mb-1">
                            LIFELINE
                        </h1>
                        <span class="text-[10px] font-black tracking-[0.25em] text-blue-600 uppercase mb-4">
                            Emergency Command
                        </span>

                        ${!state.permissionTimedOut ? `
                            <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-slate-200 shadow-sm mt-2 animate-pulse">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-blue-600"></i>
                                <span class="text-xs font-bold text-slate-700">Waiting for location permission...</span>
                            </div>
                            <p class="text-[10px] text-slate-400 mt-2 font-medium">Please click "Allow" on your browser prompt</p>
                        ` : `
                            <div class="w-full max-w-xs bg-rose-50 border border-rose-200 p-4 rounded-2xl shadow-md text-left mt-2 animate-in space-y-3">
                                <div class="flex items-center gap-2 text-rose-700">
                                    <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0"></i>
                                    <h4 class="text-xs font-black uppercase tracking-wider">Location Access Needed</h4>
                                </div>
                                <p class="text-[11px] font-semibold text-rose-900 leading-relaxed">
                                    GPS permission was not detected within 5 seconds. To find the nearest emergency hospital, please allow location.
                                </p>
                                <div class="space-y-2 pt-1">
                                    <button onclick="window.requestGPSWithPermissionGate()" class="w-full py-2.5 bg-blue-600 text-white rounded-xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-transform">
                                        <i data-lucide="locate-fixed" class="w-3.5 h-3.5"></i> Try Allow Again
                                    </button>
                                    <button onclick="window.proceedWithDefaultLocation()" class="w-full py-2 bg-white border border-slate-300 text-slate-700 rounded-xl font-bold text-[11px] uppercase tracking-wider hover:bg-slate-50">
                                        Continue with Default (Gr. Noida)
                                    </button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let tabContent = '';
            if (state.activeTab === 'home') tabContent = renderUserHome();
            else if (state.activeTab === 'map') tabContent = renderMapView();
            else if (state.activeTab === 'diseases') tabContent = renderDiseasesView();
            else if (state.activeTab === 'blood') tabContent = renderBloodView();

            root.innerHTML = `
                ${renderHeader()}
                ${tabContent}
                ${renderNavbar()}
                ${renderDetailModal()}
            `;

            if (state.activeTab === 'home') {
                renderHospitalCards();
            } else if (state.activeTab === 'map') {
                setTimeout(() => initLeafletMap(), 60);
            }

            lucide.createIcons();
        }

        render();
        window.requestGPSWithPermissionGate();
    </script>
</body>
</html>
